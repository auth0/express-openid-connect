name: Scorecard analysis

# Runs OpenSSF Scorecard supply-chain analysis directly via ossf/scorecard-action.
# All action refs are SHA-pinned. Supported triggers per OSSF are push and
# schedule on the default branch; workflow_dispatch allows a manual run.
#
# publish_results is false: results stay private to Code Scanning (no public
# badge, no id-token needed). Set it to true and add `id-token: write` to the
# job permissions to publish to the Scorecard public dataset.

on:
  push:
    branches: ['master']
  workflow_dispatch: {}
  schedule:
    - cron: '30 1 * * 6' # weekly, Saturday 01:30 UTC

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to Code Scanning
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false # required by Scorecard

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: results.sarif
          category: scorecard
