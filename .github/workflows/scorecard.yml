name: Scorecard analysis

# Runs OpenSSF Scorecard supply-chain analysis directly via ossf/scorecard-action.
# All action refs are SHA-pinned. Supported triggers per OSSF are push and
# schedule on the default branch; workflow_dispatch allows a manual run.
#
# publish_results is false: results stay private to Code Scanning (no public
# badge, no id-token needed). Set it to true and add `id-token: write` to the
# job permissions to publish to the Scorecard public dataset.

on:
  push:
    branches: ['master']
  workflow_dispatch: {}
  schedule:
    - cron: '30 1 * * 6' # weekly, Saturday 01:30 UTC

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to Code Scanning
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # required by Scorecard

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: results.sarif
          category: scorecard
